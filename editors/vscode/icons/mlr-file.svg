<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#0d1117"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- M left stroke -->
    <line x1="7" y1="26" x2="7" y2="6" stroke="#4a90d9" stroke-width="2.5"/>
    <!-- M left diagonal -->
    <line x1="7" y1="6" x2="16" y2="16" stroke="#4a90d9" stroke-width="2.5"/>
    <!-- M right diagonal -->
    <line x1="16" y1="16" x2="25" y2="6" stroke="#4a90d9" stroke-width="2.5"/>
    <!-- M right stroke -->
    <line x1="25" y1="6" x2="25" y2="26" stroke="#4a90d9" stroke-width="2.5"/>
    <!-- Lightning crack through the M -->
    <polyline points="16,10 14,15 18,17 13,23" stroke="#7ec8e3" stroke-width="1.2" opacity="0.9"/>
  </g>
</svg>
