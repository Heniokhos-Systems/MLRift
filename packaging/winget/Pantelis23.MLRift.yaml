# yaml-language-server: $schema=https://aka.ms/winget-manifest.singleton.1.6.0.schema.json
#
# NOTE: this static singleton file is a reference/historical artifact, not
# what actually gets submitted to winget-pkgs. The winget-release job in
# .github/workflows/release.yml generates its own version+installer+locale
# manifest set (zip installer with NestedInstallerFiles for mlrc+mlr) at
# release time and opens the winget-pkgs PR directly — mirrors KernRift's
# packaging/winget/Pantelis23.KernRift.yaml, which is equally superseded by
# its own release.yml job.

PackageIdentifier: Pantelis23.MLRift
PackageVersion: 1.1.0
PackageLocale: en-US
Publisher: Pantelis Christou
PublisherUrl: https://github.com/Heniokhos-Systems/MLRift
PackageName: MLRift
PackageUrl: https://github.com/Heniokhos-Systems/MLRift
License: Apache-2.0
LicenseUrl: https://github.com/Heniokhos-Systems/MLRift/blob/main/LICENSE
ShortDescription: Self-hosted systems language and compiler for machine-learning workloads
Description: |-
  MLRift is a self-hosted systems programming language and compiler forked
  from KernRift, extended with ML-specific IR primitives (tensors, event
  streams, sparse CSR ops) and a native AMDGCN GPU backend. It compiles to
  native x86_64 and ARM64 machine code and supports fat binary output for
  cross-platform distribution.
Tags:
  - compiler
  - systems-programming
  - machine-learning
  - gpu
  - language
Moniker: mlrift
ReleaseNotesUrl: https://github.com/Heniokhos-Systems/MLRift/releases/tag/v1.1.0
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Heniokhos-Systems/MLRift/releases/latest/download/mlrc-windows-x86_64.exe
    InstallerSha256: PLACEHOLDER_WINDOWS_X86_64_SHA256
    InstallerType: portable
    Commands:
      - mlrc
  - Architecture: arm64
    InstallerUrl: https://github.com/Heniokhos-Systems/MLRift/releases/latest/download/mlrc-windows-arm64.exe
    InstallerSha256: PLACEHOLDER_WINDOWS_ARM64_SHA256
    InstallerType: portable
    Commands:
      - mlrc
ManifestType: singleton
ManifestVersion: 1.6.0
